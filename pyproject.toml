[project]
name = "agentic-test-case-generation"
version = "0.1.0"
description = "Agentic AI test case generation from requirements, evaluated with DeepEval and Ragas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.2.8",
    "langchain-chroma>=1.1.0",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2
    "langchain-community<0.4.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "openai>=3.3.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_tcg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: needs OPENAI_API_KEY and calls the OpenAI API (deselect with -m 'not llm')",
]
